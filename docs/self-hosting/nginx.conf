user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    upstream api_backend { server backend:8000; }
    upstream web_frontend { server frontend:80; }

    server {
        listen 80;
        server_name _;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }
        location = /edge-health {
            access_log off;
            return 200 'ok';
        }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://oauth.telegram.org" always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Edge is directly internet-facing; do not trust client-supplied XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Temporary perimeter mitigation for unauthenticated legacy user APIs.
        # Keep /users/auth/* and /users/me reachable.
        location = /api/v1/users { return 403; }
        location = /api/v1/users/ { return 403; }
        location ~ ^/api/v1/users/(?!(?:me|stats|coach-access|export|auth)(?:/|$))[^/]+/?$ { return 403; }
        location = /telegram/webhook { return 404; }
        location = /telegram/webhook/ { return 404; }
        location = /metrics { return 404; }
        location = /docs { return 404; }
        location = /redoc { return 404; }
        location = /openapi.json { return 404; }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api_backend;
        }
        location = /health { proxy_pass http://api_backend/health; }
        location = /health/ready { proxy_pass http://api_backend/health/ready; }
        location = /health/live { proxy_pass http://api_backend/health/live; }

        # Preserve frontend caching policy; never cache config.js / sw.js for a year.
        location / { proxy_pass http://web_frontend; }
    }
}
