server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log

  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log
    # Docker json-file driver wraps each line as {"log": "<app json>", ...}.
    # Unwrap it, then expose low-cardinality audit fields as Loki labels so the
    # medical-data-access investigation queries can filter on them.
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            audit_action:
            audit_resource: audit_meta.resource
      - labels:
          audit_action:
          audit_resource:

  - job_name: fittracker
    static_configs:
      - targets:
          - localhost
        labels:
          job: fittracker
          __path__: /var/log/fittracker/*.log
