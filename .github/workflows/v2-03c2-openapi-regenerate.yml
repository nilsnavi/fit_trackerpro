name: V2-03C2 Temporary OpenAPI Regeneration
on:
  push:
    branches: ["feature/v2-03c2-client-grant-api-audit"]
permissions:
  contents: write
jobs:
  regenerate:
    if: "contains(github.event.head_commit.message, '[generate contract]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned backend and frontend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend && npm ci --no-audit --no-fund
      - name: Generate pinned API artifacts and commit only their changes
        env:
          OPENAPI_PYTHON: python
        run: |
          cd frontend
          npm run api:types:generate
          cd ..
          git add frontend/src/shared/api/generated/openapi.json frontend/src/shared/api/generated/openapi.d.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(v2-03c2): regenerate OpenAPI types from pinned backend"
          git push origin HEAD:feature/v2-03c2-client-grant-api-audit
