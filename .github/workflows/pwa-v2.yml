name: PWA v2 Foundation
on:
  push:
    paths: ['apps/pwa-v2/**', '.github/workflows/pwa-v2.yml']
  pull_request:
    paths: ['apps/pwa-v2/**', '.github/workflows/pwa-v2.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'apps/pwa-v2/package-lock.json'
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Smoke unit tests
        run: npm run test
      - name: Build
        run: npm run build
