name: PWA v2 Foundation
on:
  push:
    paths: ['apps/pwa-v2/**', '.github/workflows/pwa-v2.yml']
  pull_request:
    paths: ['apps/pwa-v2/**', '.github/workflows/pwa-v2.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (bootstrap; lockfile pending)
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
