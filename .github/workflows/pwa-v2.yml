name: PWA v2 Foundation
on:
  push:
    paths: ['apps/pwa-v2/**', '.github/workflows/pwa-v2.yml']
  pull_request:
    paths: ['apps/pwa-v2/**', '.github/workflows/pwa-v2.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'apps/pwa-v2/package-lock.json'
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Smoke unit tests
        run: npm run test
      - name: Install icon renderer
        run: python3 -m pip install --disable-pip-version-check 'cairosvg==2.7.1'
      - name: Build
        run: npm run build
      - name: Verify published icons
        run: |
          test -s dist/icons/icon-192.png
          test -s dist/icons/icon-512.png
          test -s dist/icons/maskable-512.png
          test -s dist/icons/apple-touch-icon.png
      - name: Upload PWA preview build
        uses: actions/upload-artifact@v4
        with:
          name: pwa-v2-preview
          path: apps/pwa-v2/dist
          retention-days: 7

  responsive-smoke:
    name: PWA v2 responsive Chromium smoke
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tested Playwright runner
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Download V2 production build
        uses: actions/download-artifact@v8
        with:
          name: pwa-v2-preview
          path: apps/pwa-v2/dist
      - name: Install V2 preview server
        working-directory: apps/pwa-v2
        run: npm ci --no-audit --no-fund
      - name: Run viewport and route smoke
        shell: bash
        run: |
          set -euo pipefail
          cd apps/pwa-v2
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/ftp-v2-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ > /dev/null
          node scripts/responsive-smoke.mjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-v2-responsive-screenshots
          path: apps/pwa-v2/visual-results/
          if-no-files-found: ignore
          retention-days: 7
