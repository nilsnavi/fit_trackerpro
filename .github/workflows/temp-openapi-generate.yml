name: Temporary OpenAPI artifact regeneration

on:
  push:
    branches:
      - feature/v2-03c4b-coach-selector-mainline

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend export dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate committed OpenAPI artifacts
        working-directory: frontend
        run: npm run api:types:generate
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/shared/api/generated/openapi.json frontend/src/shared/api/generated/openapi.d.ts
          if git diff --cached --quiet; then
            echo "OpenAPI artifacts are already up to date."
            exit 0
          fi
          git commit -m "chore(api): regenerate OpenAPI contract artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
