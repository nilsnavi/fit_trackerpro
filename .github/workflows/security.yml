name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            dir /repo \
              --config /repo/.gitleaks.toml \
              --redact \
              --verbose

  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # dependency-review-action can only run when the repository has the
      # Dependency Graph enabled (Settings -> Security -> Dependency graph).
      # Without this preflight the job fails on every PR with "Dependency review
      # is not supported on this repository", which looks like a dependency
      # problem and hides the real cause. While the graph is off the review is
      # skipped with a warning; once enabled it becomes blocking again.
      - name: Check dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # The SBOM endpoint answers 200 only when the dependency graph is on,
          # and 404 when it is disabled (verified against this repository).
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Dependency graph is enabled."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is disabled for this repository, so dependency review cannot run. Enable it in Settings -> Security -> Dependency graph to turn this check back on."
          fi

      - name: Review dependencies
              dependabot/github_actions/actions/dependency-review-action-5
        uses: actions/dependency-review-action@v5

        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v4
        main
        with:
          fail-on-severity: moderate

  codeql-analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements/dev.txt

  npm-audit:
    name: Frontend npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Blocking gate: anything that ships in the production bundle must be clean.
      - name: Run npm audit (production dependencies, blocking)
        run: npm audit --omit=dev --audit-level=high

      # Report-only: build tooling (vite/esbuild/eslint/openapi codegen) does not
      # reach users' browsers, so it must not block merges. Tracked in issue for the
      # dev-chain upgrade; findings are still surfaced in the job summary.
      - name: Run npm audit (all dependencies, report only)
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          {
            echo '### npm audit — full tree (dev tooling, non-blocking)'
            echo ''
            echo '```'
            npm audit --audit-level=moderate || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
