version: 2
updates:
  - package-ecosystem: "npm"
    directory: /
    schedule:
      interval: "weekly"
    group: "all"
    commit-message:
      prefix: "fix(deps)"
    auto-merge:
      enable: true
      method: "merge"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    group: "all"
    commit-message:
      prefix: "chore(deps)"
    auto-merge:
      enable: true
      method: "merge"
    # Majors that break the build/peers and need a dedicated migration PR.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    group: "all"
    commit-message:
      prefix: "chore(deps)"
    auto-merge:
      enable: true
      method: "merge"

  - package-ecosystem: "docker"
    directory: /
    schedule:
      interval: "weekly"
    group: "all"
    commit-message:
      prefix: "fix(deps)"
    auto-merge:
      enable: true
      method: "merge"
